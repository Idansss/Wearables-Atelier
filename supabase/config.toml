project_id = "bnjorikwjrlirqvxkcxm"

[auth]
enabled = true
site_url = "https://wearablesatelier.com"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/account",
  "http://localhost:4173",
  "http://localhost:4173/account",
  "https://wearablesatelier.com",
  "https://wearablesatelier.com/account",
  "https://www.wearablesatelier.com",
  "https://www.wearablesatelier.com/account",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 6
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
